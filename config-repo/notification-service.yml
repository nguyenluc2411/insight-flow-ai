# =============================================================================
# notification-service.yml — Config-server overrides for notification-service
# Port: 8091
# =============================================================================

spring:
  jpa:
    properties:
      hibernate:
        default_schema: notification_db
  flyway:
    schemas: notification_db
    default-schema: notification_db

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          # Default false = MailHog (dev). Trên EC2 set MAIL_SMTP_AUTH=true + STARTTLS=true cho Gmail.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  notification:
    default-low-stock-threshold: 10
    # From hiển thị trên email. Với Gmail nên set MAIL_FROM = chính địa chỉ Gmail đăng nhập.
    mail-from: ${MAIL_FROM:noreply@insightflow.ai}
  # Thông tin bên bán in trên biên nhận thanh toán (email hóa đơn). Có thể override qua env.
  invoice:
    company-name: ${INVOICE_COMPANY_NAME:Insight Flow AI}
    company-tagline: ${INVOICE_COMPANY_TAGLINE:Dự báo nhu cầu & tối ưu tồn kho cho nhà bán lẻ}
    company-address: ${INVOICE_COMPANY_ADDRESS:}
    company-tax-code: ${INVOICE_COMPANY_TAX_CODE:}
    support-email: ${INVOICE_SUPPORT_EMAIL:support@insightflow.ai}
    support-hotline: ${INVOICE_SUPPORT_HOTLINE:}
    website: ${INVOICE_WEBSITE:https://insightflow.ai}
    brand-color: ${INVOICE_BRAND_COLOR:#4f46e5}
