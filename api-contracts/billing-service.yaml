openapi: "3.1.0"
info:
  title: Billing Service API
  description: |
    Subscription management, entitlement checks, and usage tracking for Insight Flow AI.

    ## Plan Tiers
    | Code | Price | Trial |
    |------|-------|-------|
    | free | 0 | — |
    | trial | 0 | 30 days (Advanced features) |
    | basic | 199,000 VND/mo | — |
    | advanced | 499,000 VND/mo | — |
    | pro | 699,000 VND/mo | — |

    ## Upgrade Flow (MVP — no payment gateway)
    1. `POST /subscriptions/upgrade-request` — tenant submits request
    2. Ops reviews via internal endpoint `POST /internal/upgrade-requests/{id}/approve`
    3. Subscription switches immediately upon approval

    ## Internal Endpoints
    `/api/v1/internal/**` requires a **service JWT** (`Authorization: Bearer <service-token>`).
    These are called by api-gateway (quota check) and ops tooling — not by the frontend.

  version: "1.0.0"
  contact:
    name: Insight Flow AI
    email: dev@insightflow.ai

servers:
  - url: http://localhost:8080/api/v1/billing
    description: Via API Gateway (dev)
  - url: http://localhost:8086/api/v1/billing
    description: Direct (dev)

tags:
  - name: Packages
    description: Available subscription packages and plans
  - name: Subscriptions
    description: Current tenant subscription management
  - name: Entitlements
    description: Feature access and usage tracking
  - name: Billing Admin
    description: Billing history for current tenant
  - name: Admin Refunds
    description: Refund reconciliation for invalid/duplicate transfers (SUPER_ADMIN)
  - name: Internal
    description: Service-to-service endpoints (requires service JWT)

paths:
  /packages:
    get:
      operationId: listPackages
      summary: List all active packages
      tags: [Packages]
      responses:
        '200':
          description: List of packages with plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageResponse'

  /packages/{code}:
    get:
      operationId: getPackageByCode
      summary: Get package details by code
      tags: [Packages]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: advanced
      responses:
        '200':
          description: Package details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      summary: Get the current active subscription for the caller's tenant
      tags: [Subscriptions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/upgrade-request:
    post:
      operationId: submitUpgradeRequest
      summary: Submit a manual upgrade request (ops approves — no payment in MVP)
      tags: [Subscriptions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpgradeRequestRequest'
      responses:
        '202':
          description: Upgrade request submitted, pending ops approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRequestResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /entitlements:
    get:
      operationId: getEntitlements
      summary: Get all feature entitlements for current tenant
      tags: [Entitlements]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Entitlement summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /entitlements/features/{featureCode}:
    get:
      operationId: checkFeatureAccess
      summary: Check if current tenant has access to a specific feature
      tags: [Entitlements]
      security:
        - BearerAuth: []
      parameters:
        - name: featureCode
          in: path
          required: true
          schema:
            type: string
            example: forecast.advanced
      responses:
        '200':
          description: Feature access result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /entitlements/usage:
    get:
      operationId: getUsageStats
      summary: Get today's usage statistics for current tenant
      tags: [Entitlements]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/history:
    get:
      operationId: getBillingHistory
      summary: Get billing history for current tenant
      tags: [Billing Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated billing history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBillingHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/refunds:
    get:
      operationId: listRefundTransactions
      summary: List transactions awaiting refund reconciliation (SUPER_ADMIN)
      description: >
        Returns payment transactions filtered by status (default PENDING_REFUND),
        newest first. Requires the SUPER_ADMIN role (enforced via the
        gateway-propagated role header).
      tags: [Admin Refunds]
      security:
        - BearerAuth: []
      parameters:
        - name: statuses
          in: query
          description: One or more statuses to include (case-insensitive). Values include SUCCESS, PENDING_REFUND, REFUNDED, JUNK.
          schema:
            type: array
            items:
              type: string
            default: [PENDING_REFUND]
        - name: q
          in: query
          required: false
          description: >
            Optional case-insensitive search keyword. Matches against reference code,
            transfer memo (content), order code (IFLOWxxxxxx), package code and tenant id.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePaymentTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/refunds/{id}:
    get:
      operationId: getRefundTransactionDetail
      summary: Get a transaction's detail for refund verification (SUPER_ADMIN)
      description: >
        Returns the transaction info an admin needs to reconcile a transfer: bank
        reference code, transfer memo, amount and the actual transfer date. To get the
        customer's contact details, resolve tenantId via auth-service's admin API
        (GET /api/v1/admin/tenants/{id}); tenantId is null for unmatched transfers.
      tags: [Admin Refunds]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteJunkTransaction
      summary: Permanently delete a junk transaction (SUPER_ADMIN)
      description: >
        Hard-deletes a transaction from the junk bin. Only a transaction already in
        JUNK status can be deleted; this is irreversible.
      tags: [Admin Refunds]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transaction is not in JUNK state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/refunds/{id}/confirm-refund:
    post:
      operationId: confirmManualRefund
      summary: Mark a transaction as manually refunded (SUPER_ADMIN)
      description: >
        Records that the admin has refunded the customer out-of-band. Only a
        transaction in PENDING_REFUND can be confirmed; its status moves to REFUNDED,
        an audit note is appended to errorReason, and a refund.success event is emitted.
      tags: [Admin Refunds]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional audit note (refund reference / reason).
                  example: Đã hoàn 499.000đ qua MB, ref FT24XXXX
      responses:
        '200':
          description: Refund confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transaction is not in PENDING_REFUND state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/refunds/{id}/mark-junk:
    post:
      operationId: markTransactionAsJunk
      summary: Mark a transaction as not belonging to the system (SUPER_ADMIN)
      description: >
        Moves a PENDING_REFUND transaction into the junk bin (status JUNK) — e.g. a
        stranger's transfer that does not belong to any order. Only a transaction in
        PENDING_REFUND can be marked; an audit note is appended to errorReason.
      tags: [Admin Refunds]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional audit note (why it is not ours).
      responses:
        '200':
          description: Transaction moved to junk
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transaction is not in PENDING_REFUND state
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

x-internal-note: >
  Internal endpoints below are served at /api/v1/internal/** (not under /billing).
  They require service JWT and are not routed through the public gateway path.

x-paths-internal:
  /tenants/{tenantId}/limits:
    get:
      operationId: getTenantLimits
      summary: Get rate limits for a tenant (service-to-service)
      tags: [Internal]
      security:
        - ServiceJWT: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rate limit info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'

  /tenants/{tenantId}/usage/check:
    post:
      operationId: checkAndConsumeApiCall
      summary: Count one API call and enforce daily quota (service-to-service)
      tags: [Internal]
      security:
        - ServiceJWT: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated rate limit after consuming one call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitResponse'
        '429':
          description: Daily quota exceeded

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT issued by auth-service (validated by api-gateway)
    ServiceJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service JWT (must match SERVICE_JWT_SECRET)

  schemas:
    PackageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: advanced
        version:
          type: integer
        name:
          type: string
          example: Advanced
        description:
          type: string
        displayOrder:
          type: integer
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanResponse'
        featureCodes:
          type: array
          items:
            type: string
          example: [forecast.advanced, inventory.alerts, export.csv]

    PlanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        packageId:
          type: string
          format: uuid
        billingCycle:
          type: string
          enum: [MONTHLY, YEARLY]
        priceVnd:
          type: integer
          example: 499000
        currency:
          type: string
          example: VND
        trialDays:
          type: integer
          example: 30
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    SubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        priceAtSubscription:
          type: integer
        featuresAtSubscription:
          type: array
          items:
            type: string
        limitsAtSubscription:
          type: object
          additionalProperties: true
        planVersion:
          type: integer
        status:
          type: string
          enum: [ACTIVE, TRIAL, EXPIRED, CANCELLED]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        autoRenew:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EntitlementResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        subscriptionStatus:
          type: string
          enum: [ACTIVE, TRIAL, EXPIRED, CANCELLED]
        featureCodes:
          type: array
          items:
            type: string
        cached:
          type: boolean

    FeatureAccessResponse:
      type: object
      properties:
        featureCode:
          type: string
        hasAccess:
          type: boolean
        reason:
          type: string
          example: Feature not included in current plan

    UsageStatusResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        usageDate:
          type: string
          format: date
        apiCallsCount:
          type: integer
        maxApiCallsPerDay:
          type: integer
        productExportsCount:
          type: integer
        reportsGeneratedCount:
          type: integer
        forecastsExecutedCount:
          type: integer
        storageUsedBytes:
          type: integer
          format: int64
        maxStorageGb:
          type: integer

    RateLimitResponse:
      type: object
      properties:
        allowed:
          type: boolean
        remaining:
          type: integer
        limit:
          type: integer
        rateLimitPerMinute:
          type: integer

    UpgradeRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        requestedPackageCode:
          type: string
        billingCycle:
          type: string
          enum: [MONTHLY, YEARLY]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        note:
          type: string
        resolvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateUpgradeRequestRequest:
      type: object
      required: [packageCode]
      properties:
        packageCode:
          type: string
          example: pro
        billingCycle:
          type: string
          enum: [MONTHLY, YEARLY]
          default: MONTHLY

    BillingHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        eventType:
          type: string
          example: PLAN_UPGRADED
        fromPackageCode:
          type: string
        toPackageCode:
          type: string
        amountVnd:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    PageBillingHistory:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BillingHistory'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    PaymentTransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sepayId:
          type: string
          description: SePay transaction id (webhook idempotency key).
        tenantId:
          type: string
          format: uuid
          description: Null for transfers that could not be matched to a tenant.
        packageCode:
          type: string
        amount:
          type: integer
          example: 499000
        accountNumber:
          type: string
          description: Receiving (merchant) bank account.
        senderAccountNumber:
          type: string
          description: Sender account — usually null (SePay does not provide it); use referenceCode instead.
        referenceCode:
          type: string
          description: Bank/SePay reference code — the reliable key to reconcile against a bank statement.
        content:
          type: string
          description: Raw bank transfer memo.
        status:
          type: string
          enum: [SUCCESS, PENDING_REFUND, REFUNDED]
        errorReason:
          type: string
          description: Why the transfer needs a refund, plus the admin audit trail.
        transactionDate:
          type: string
          format: date-time
          description: Actual bank-transfer time reported by the webhook.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagePaymentTransaction:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTransactionResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated but lacks the required role (SUPER_ADMIN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
